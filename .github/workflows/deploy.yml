name: Deploy na Hostinger (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita dois deploys simultâneos escrevendo no servidor ao mesmo tempo.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Gera o site estático em ./out (next.config.ts usa output: "export").
      - name: Build
        run: npm run build

      - name: Enviar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          # Só o resultado do build vai para o servidor — código-fonte,
          # node_modules e configs locais nunca saem do runner.
          local-dir: ./out/
          # O login FTP da Hostinger já abre dentro de public_html.
          server-dir: ./
          # Sem ponto inicial: a Hostinger bloqueia a leitura de dotfiles via FTP.
          state-name: ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env*
            **/.DS_Store
